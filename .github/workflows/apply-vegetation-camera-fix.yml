name: Apply vegetation camera-space fix

on:
  push:
    branches:
      - agent/fix-vegetation-camera-space

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep procedural samples in world space
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "for(let k=0;k<7;k++){const mvx=px+2+NZ.h2(tx,ty,k*7+5)*(ts-4),mvy=py+2+NZ.h2(tx,ty,k*7+6)*(ts-4);\nconst local=NZ.v2(mvx*0.05,mvy*0.05,53);if(local<0.45)continue;",
                  "for(let k=0;k<7;k++){const wmvx=tx*ts+2+NZ.h2(tx,ty,k*7+5)*(ts-4),wmvy=ty*ts+2+NZ.h2(tx,ty,k*7+6)*(ts-4),mvx=wmvx-cam.x,mvy=wmvy-cam.y;\nconst local=NZ.v2(wmvx*0.05,wmvy*0.05,53);if(local<0.45)continue;",
              ),
              (
                  "for(let i=0;i<=8;i++){const mx2=px+i*(ts/8);const dp=1+NZ.v2(mx2*0.09,ty*0.6,53)*8*dens;c.lineTo(mx2,py+dp);}",
                  "for(let i=0;i<=8;i++){const wmx2=tx*ts+i*(ts/8),mx2=wmx2-cam.x;const dp=1+NZ.v2(wmx2*0.09,ty*0.6,53)*8*dens;c.lineTo(mx2,py+dp);}",
              ),
              (
                  "c.fillStyle=mg[1];for(let i=0;i<5;i++){const dxm=px+2+NZ.h2(tx,ty,i+13)*(ts-4);\n const l=NZ.v2(dxm*0.07,ty*0.5,53);if(l<0.42)continue;",
                  "c.fillStyle=mg[1];for(let i=0;i<5;i++){const wdxm=tx*ts+2+NZ.h2(tx,ty,i+13)*(ts-4),dxm=wdxm-cam.x;\n const l=NZ.v2(wdxm*0.07,ty*0.5,53);if(l<0.42)continue;",
              ),
              (
                  "for(let i=0;i<=6;i++){const gx=px+i*(ts/6);c.lineTo(gx,py-1-NZ.v2(gx*0.14,ty,53)*5*dens);}",
                  "for(let i=0;i<=6;i++){const wgx=tx*ts+i*(ts/6),gx=wgx-cam.x;c.lineTo(gx,py-1-NZ.v2(wgx*0.14,ty,53)*5*dens);}",
              ),
              (
                  "  const vx=px+3+rnd(sI*5+40)*(ts-6);\n  // stems hang longer where the field is rich, and each has its own species pulled from the field\n  const species=Math.floor(NZ.v2(vx*0.05,ty*0.3,91)*4);",
                  "  const wvx=tx*ts+3+rnd(sI*5+40)*(ts-6),vx=wvx-cam.x;\n  // stems hang longer where the field is rich, and each has its own species pulled from the field\n  const species=Math.floor(NZ.v2(wvx*0.05,ty*0.3,91)*4);",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:90]!r}")
              source = source.replace(old, new)

          forbidden = [
              "NZ.v2(mvx*0.05,mvy*0.05,53)",
              "NZ.v2(mx2*0.09,ty*0.6,53)",
              "NZ.v2(dxm*0.07,ty*0.5,53)",
              "NZ.v2(gx*0.14,ty,53)",
              "NZ.v2(vx*0.05,ty*0.3,91)",
          ]
          leftovers = [item for item in forbidden if item in source]
          if leftovers:
              raise SystemExit(f"Camera-space noise samples remain: {leftovers}")

          path.write_text(source, encoding="utf-8")

      - name: Validate and commit
        run: |
          git diff --check
          git diff --exit-code --quiet && { echo "Patch produced no changes"; exit 1; } || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: keep vegetation noise in world space"
          git push
